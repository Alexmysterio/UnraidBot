name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests y lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: unraidbot:ci

      - name: Smoke test
        run: >-
          docker run --rm --entrypoint python unraidbot:ci
          -c "import bot.app, bot.doctor; print('imports ok')"
